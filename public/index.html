<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>WorkQuest: Escape from the Underclass</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237c3aed'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; the Dockerfile's builder
       stage compiles it to public/tailwind.css on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The native-feel UI kit and the platform bridge are CENTRALLY HOSTED.
       Never vendor either one: a copy freezes on the day it is made, and the
       fleet-wide fix and one-redeploy rollback central hosting buys stop
       reaching this app. The bridge tag is also how the app ANSWERS the
       shell, so it is not conditional on calling a bridge API. The platform
       serves these on this app's own origin, so the paths are relative: no
       hostname here for a platform domain move to break. -->
  <link rel="stylesheet" href="/usernode-native/v1/native.css">
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <script src="/usernode-native/v1/native.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased">

<!-- Fixed shell: the page itself never scrolls, only #scroll does. That is
     what stops the on-screen keyboard from reflowing the whole frame.
     Capped at a phone-ish column and centred, so the same layout that reads
     well at 390px doesn't stretch a task row across 1280px of desktop. -->
<div class="fixed inset-0 mx-auto max-w-2xl flex flex-col overflow-hidden border-x border-zinc-800/60">

  <header id="topbar" class="shrink-0 bg-zinc-950/90 backdrop-blur border-b border-zinc-800/80"
          style="padding-top: var(--un-safe-inset-top, env(safe-area-inset-top, 0px))">
    <div class="px-4 pt-3 pb-2 flex items-center gap-3">
      <div class="min-w-0 flex-1">
        <div id="screen-title" class="text-base font-semibold leading-tight truncate">Journal</div>
        <div id="screen-sub" class="text-xs text-zinc-500 truncate">Loading…</div>
      </div>
      <div id="streak-chip" class="hidden shrink-0 text-xs px-2 py-1 rounded-full border border-amber-500/40 bg-amber-500/10 text-amber-300"></div>
    </div>
    <div id="currency-strip" class="px-4 pb-2 flex items-center gap-2 text-xs overflow-x-auto"></div>
  </header>

  <main id="scroll" class="flex-1 overflow-y-auto overscroll-y-contain">
    <section data-screen="journal" class="pb-8"></section>
    <section data-screen="workshop" class="pb-8 hidden"></section>
    <section data-screen="season" class="pb-8 hidden"></section>
    <section data-screen="profile" class="pb-8 hidden"></section>
  </main>

  <nav id="tabbar" class="shrink-0 grid grid-cols-4 bg-zinc-950/95 backdrop-blur border-t border-zinc-800"
       style="padding-bottom: var(--un-safe-inset-bottom, env(safe-area-inset-bottom, 0px))">
    <button data-tab="journal"  class="un-pressable py-2.5 flex flex-col items-center gap-0.5 text-[11px] text-zinc-500">
      <span class="text-lg leading-none">📓</span><span>Journal</span>
    </button>
    <button data-tab="workshop" class="un-pressable py-2.5 flex flex-col items-center gap-0.5 text-[11px] text-zinc-500">
      <span class="text-lg leading-none">🛠️</span><span>Workshop</span>
    </button>
    <button data-tab="season"   class="un-pressable py-2.5 flex flex-col items-center gap-0.5 text-[11px] text-zinc-500">
      <span class="text-lg leading-none">🎟️</span><span>Season</span>
    </button>
    <button data-tab="profile"  class="un-pressable py-2.5 flex flex-col items-center gap-0.5 text-[11px] text-zinc-500">
      <span class="text-lg leading-none">🧑‍🚀</span><span>Profile</span>
    </button>
  </nav>
</div>

<script src="/app.js"></script>
<script src="/journal.js"></script>
<script src="/workshop.js"></script>
<script src="/season.js"></script>
<script src="/profile.js"></script>
<script>WQ.boot();</script>
</body>
</html>
